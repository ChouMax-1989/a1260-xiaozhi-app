name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Verify public assets
        run: python3 scripts/verify_assets.py
      - name: Test, lint and build
        run: ./gradlew --no-daemon --dependency-verification strict :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
